name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run check

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.13.0, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run cross-platform source contracts
        run: npm run typecheck && npm test && npm run build

      - name: Run installed package contract
        run: npm run pack:check
        env:
          BOUNDEDRELAY_PACKAGE_SMOKE_OUTPUT_DIR:
            ${{ runner.temp }}/boundedrelay-package-smoke-${{ matrix.node }}

      - name: Verify installed npm shim on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "${BOUNDEDRELAY_PACKAGE_SMOKE_OUTPUT_DIR}/consumer/node_modules/.bin/boundedrelay" --version
        env:
          BOUNDEDRELAY_PACKAGE_SMOKE_OUTPUT_DIR:
            ${{ runner.temp }}/boundedrelay-package-smoke-${{ matrix.node }}

      - name: Verify installed npm shim on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $env:BOUNDEDRELAY_PACKAGE_SMOKE_OUTPUT_DIR "consumer/node_modules/.bin/boundedrelay.cmd") --version
        env:
          BOUNDEDRELAY_PACKAGE_SMOKE_OUTPUT_DIR:
            ${{ runner.temp }}/boundedrelay-package-smoke-${{ matrix.node }}
